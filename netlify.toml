[build]
  command = 'hugo --gc --minify --baseURL "$URL"'
  publish = 'public'

[build.environment]
  HUGO_VERSION = '0.168.0'
  HUGO_ENV = 'production'
  TZ = 'Europe/Paris'

[[headers]]
  for = '/*'
  [headers.values]
    X-Content-Type-Options = 'nosniff'
    Referrer-Policy = 'strict-origin-when-cross-origin'
    X-Frame-Options = 'DENY'

[[headers]]
  for = '/images/*'
  [headers.values]
    Cache-Control = 'public, max-age=604800'
